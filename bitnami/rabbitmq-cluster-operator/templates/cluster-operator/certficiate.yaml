{{- if and (.Values.useCertManager) (not .Values.clusterOperator.existingWebhookCertSecret) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- $versionLabel := dict "app.kubernetes.io/version" ( include "common.images.version" ( dict "imageRoot" .Values.clusterOperator.image "chart" .Chart ) ) }}
  {{- $labels := include "common.tplvalues.merge" ( dict "values" ( list .Values.commonLabels $versionLabel ) "context" . ) }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: messaging-topology-operator
    app.kubernetes.io/part-of: rabbitmq
  name: {{ template "rmqco.clusterOperator.webhook.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  commonName: {{ template "rmqco.clusterOperator.webhook.fullname" . }}
  dnsNames:
    - {{ printf "%s.%s.svc" (include "rmqco.clusterOperator.webhook.fullname" .) (include "common.names.namespace" .) }}
    - {{ printf "%s.%s.svc.%s" (include "rmqco.clusterOperator.webhook.fullname" .) (include "common.names.namespace" .) .Values.clusterDomain }}
  issuerRef:
    kind: Issuer
    name: {{ template "common.names.fullname" . }}
  secretName: {{ template "rmqco.clusterOperator.webhook.fullname" . }}
{{- end }}
