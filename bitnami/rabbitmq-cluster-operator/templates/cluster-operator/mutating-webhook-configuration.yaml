{{- if not .Values.clusterOperator.skipCreateAdmissionWebhookConfig }}
{{- $versionLabel := dict "app.kubernetes.io/version" ( include "common.images.version" ( dict "imageRoot" .Values.clusterOperator.image "chart" .Chart ) ) }}
{{- $labels := include "common.tplvalues.merge" ( dict "values" ( list .Values.commonLabels $versionLabel ) "context" . ) }}
{{/*
    If the user does not have cert-manager and is not providing a secret with the certificates, the chart needs to generate the secret
  */}}
{{- $secretName := printf "%s" (include "rmqco.clusterOperator.webhook.fullname" .) }}
{{- $ca := genCA "rmq-msg-topology-ca" 365 }}
{{- $cert := genSignedCert (include "rmqco.clusterOperator.fullname" .) nil (list (printf "%s.%s.svc" (include "rmqco.clusterOperator.webhook.fullname" .) (include "common.names.namespace" .)) (printf "%s.%s.svc.%s" (include "rmqco.clusterOperator.webhook.fullname" .) (include "common.names.namespace" .) .Values.clusterDomain)) 365 $ca }}
{{- if and (not .Values.useCertManager) (not .Values.clusterOperator.existingWebhookCertSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ include "common.secrets.lookup" (dict "secret" $secretName "key" "tls.crt" "defaultValue" $cert.Cert "context" $) }}
  tls.key: {{ include "common.secrets.lookup" (dict "secret" $secretName "key" "tls.key" "defaultValue" $cert.Key "context" $) }}
  ca.crt: {{ include "common.secrets.lookup" (dict "secret" $secretName "key" "ca.crt" "defaultValue" $ca.Cert "context" $) }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels: {{- include "common.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: cluster-operator
    app.kubernetes.io/part-of: rabbitmq
  annotations:
    {{- if and (.Values.useCertManager) (not .Values.clusterOperator.existingWebhookCertSecret)}}
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" (include "common.names.namespace" .) ( include "rmqco.clusterOperator.webhook.secretName" . ) }}
    {{- else if and (.Values.useCertManager) (.Values.clusterOperator.existingWebhookCertSecret)}}
    cert-manager.io/inject-ca-from-secret: {{ printf "%s/%s" (include "common.names.namespace" .) ( include "rmqco.clusterOperator.webhook.secretName" . ) }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
  name: {{ template "rmqco.clusterOperator.webhook.fullname.namespace" . }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      {{- if not .Values.useCertManager }}
      caBundle: {{ include "common.secrets.lookup" (dict "secret" $secretName "key" "ca.crt" "defaultValue" (default $ca.Cert .Values.clusterOperator.existingWebhookCertCABundle) "context" $) }}
      {{- end }}
      service:
        name: {{ template "rmqco.clusterOperator.webhook.fullname" . }}
        namespace: {{ include "common.names.namespace" . | quote }}
        path: /mutate-rabbitmq-com-v1beta1-rabbitmqcluster
        port: {{ .Values.clusterOperator.containerPorts.webhook }}
    failurePolicy: Fail
    name: mrabbitmqcluster-v1beta1.kb.io
    rules:
      - apiGroups:
          - rabbitmq.com
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - rabbitmqclusters
    sideEffects: None
{{- end }}
